<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleado · La Carta</title>
  <link rel="stylesheet" href="/static/main.css">
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.19/auth0-spa-js.production.js"></script>
  <script type="module" src="/static/paginas/empleado.js"></script>
</head>
<body>
  <div class="app">
    <aside class="app__lateral barra-lateral">
      <a class="barra-lateral__marca" href="/restaurantes">
        <span class="barra-lateral__marca-icono" aria-hidden="true">L</span>
        <span class="barra-lateral__marca-nombre">La Carta</span>
      </a>
      <nav class="nav" aria-label="Navegación principal" data-nav></nav>
    </aside>

    <div class="app__principal">
      <header class="barra-superior">
        <nav class="migas" aria-label="Ruta actual" data-migas></nav>
        <div class="barra-superior__usuario usuario" data-usuario></div>
      </header>

      <main class="pagina">
        <div class="pagina__avisos avisos avisos--vacio" data-avisos></div>

        <div data-contenido>
          <header class="pagina__cabecera">
            <h1 class="pagina__titulo" data-campo="nombre">Cargando…</h1>
            <div class="acciones">
              <a class="boton" data-enlace="editar" data-requiere="write:empleados" hidden>Editar</a>
              <button class="boton boton--peligro" type="button" data-accion="eliminar"
                      data-confirmar="¿Eliminar a este empleado?" data-requiere="delete:empleados" hidden>Eliminar</button>
            </div>
          </header>

          <dl class="propiedades">
            <div class="propiedades__fila">
              <dt class="propiedades__nombre">Restaurante</dt>
              <dd class="propiedades__valor"><a data-enlace="restaurante" data-campo="restaurante"></a></dd>
            </div>
            <div class="propiedades__fila">
              <dt class="propiedades__nombre">Estado</dt>
              <dd class="propiedades__valor"><span class="estado" data-estado></span></dd>
            </div>

            <!-- Datos privados: la API solo los manda a quien tiene write:empleados -->
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">C.I.</dt>
              <dd class="propiedades__valor" data-campo="ci"></dd>
            </div>
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">Salario</dt>
              <dd class="propiedades__valor" data-campo="salario"></dd>
            </div>
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">Fecha de ingreso</dt>
              <dd class="propiedades__valor" data-campo="fecha_ingreso"></dd>
            </div>
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">Correo</dt>
              <dd class="propiedades__valor" data-campo="correo"></dd>
            </div>
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">Teléfono</dt>
              <dd class="propiedades__valor" data-campo="telefono"></dd>
            </div>
            <div class="propiedades__fila" data-privado hidden>
              <dt class="propiedades__nombre">Dirección</dt>
              <dd class="propiedades__valor" data-campo="direccion"></dd>
            </div>
          </dl>
        </div>
      </main>
    </div>
  </div>

</body>
</html>
