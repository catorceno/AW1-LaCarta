# Nginx en el host de la EC2 (no en Compose).
# Se copia a /etc/nginx/sites-available/lacarta. Esta es la versión HTTP:
# después, `certbot --nginx` agrega los bloques de 443 y la redirección 80 -> 443.

# carta.  -> Flask (Gunicorn publicado solo en 127.0.0.1:5001)
server {
    listen 80;
    server_name carta.lacarta-camila.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# admin. -> Django (Gunicorn publicado solo en 127.0.0.1:8000)
server {
    listen 80;
    server_name admin.lacarta-camila.duckdns.org;

    # CSS y JS del admin: los genera collectstatic (servicio migrate) y Nginx
    # los sirve desde el disco, sin pasar por Django.
    location /static/ {
        alias /home/ubuntu/AW1-LaCarta/admin/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
